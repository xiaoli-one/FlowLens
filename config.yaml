# pass_scan 全局配置。
#
# 这里控制调度层，不是某个漏洞的 payload。
# SQL 注入 payload 在 pass_scan/sql_injection/rules.yaml。
# 指纹规则在 pass_scan/fingerprint/rules.yaml + rules.generated.yaml。
#
# 启用哪些检测：
#   python run.py                      默认同时做 SQL 注入 + XSS + 指纹识别 + 命令注入 + 目录遍历 + SSRF + XXE + SSTI + redir + 敏感信息泄漏 + OSS/对象存储桶 + 文件上传 + JWT
#   python run.py --sqli               只做 SQL 注入
#   python run.py --xss                只做 XSS
#   python run.py --rce                只做命令注入
#   python run.py --lfi                只做目录遍历/任意文件读取
#   python run.py --ssrf               只做 SSRF
#   python run.py --xxe                只做 XXE
#   python run.py --ssti               只做 SSTI
#   python run.py --redir              只做开放重定向/CRLF 响应头注入
#   python run.py --sensitive          只做敏感信息泄漏检测
#   python run.py --oss                只做 OSS/对象存储桶检测
#   python run.py --upload             只做文件上传漏洞检测
#   python run.py --jwt                只做 JWT 漏洞检测
#   python run.py --fp                 只做指纹识别
#   python run.py --sqli --rce         SQL 注入 + 命令注入
# 命令行一旦指定检测参数，就只做指定的，覆盖下面的 enabled 开关。

scan:
  # passive: 只适合以后做纯被动规则
  # light:   少量主动检测
  # normal:  默认模式
  # aggressive: 以后可以放更重的检测
  mode: normal

  # 每类漏洞队列默认 worker 数。不要太大，否则 Burp 联动时会明显变慢。
  worker_count: 5

  # 每类漏洞待扫描任务队列上限。满了就丢弃这一类漏洞的新任务，保护本机和目标站点。
  queue_size: 200

  # 同一个扫描点多久内不重复扫描，单位秒。
  dedup_ttl_seconds: 1800

  # 同一个 host 的主动任务间隔，单位秒。
  per_host_interval_seconds: 0.2

  # 单个请求最多取多少个参数交给插件，避免一个请求参数过多导致爆炸。
  max_params_per_request: 8

  # 终端状态输出间隔，单位秒。会按漏洞类型显示队列剩余、正在执行、已完成。
  status_interval_seconds: 3

  # 全量 payload 扫描开关。
  # false：正常扫描。
  # true：未确认漏洞前尽量跑更完整的 payload/tamper，速度会明显变慢。
  #      同时会强制开启 Cookie/Header 注入检测，包括只有 Cookie/Header、没有 query/form/json 的请求。
  # 注意：同一个参数一旦确认某类漏洞，例如 SQL 注入，就不会继续刷 SQL 注入 payload；
  #      但后续 XSS、RCE、SSRF 等其他漏洞插件仍然可以继续检测。
  full_payload_scan: false

  # 确认当前 IP/会话被 WAF 封禁后，当前 host 暂停多久再继续，单位秒。
  # 普通 payload 被 WAF 拦截不会等待，会继续尝试 tamper 绕过。
  waf_backoff_seconds: 1800

  # 同一个 host 连续确认被 WAF 封禁多少次后结束当前扫描任务。
  waf_max_block_attempts: 3

  # 浏览器/系统自己的后台流量，不记录、不扫描。
  # 支持通配符，例如 clients*.google.com、*.telemetry.mozilla.org。
  ignored_hosts:
    # Firefox 后台服务。
    - aus5.mozilla.org
    - ads.mozilla.org
    - push.services.mozilla.com
    - firefox.settings.services.mozilla.com
    - classify-client.services.mozilla.com
    - contile.services.mozilla.com
    - "*.services.mozilla.com"
    - detectportal.firefox.com
    - location.services.mozilla.com
    - shavar.services.mozilla.com
    - remote-settings.mozilla.org
    - versioncheck.addons.mozilla.org
    - crash-reports.mozilla.com
    - telemetry.mozilla.org
    - "*.telemetry.mozilla.org"
    - cdn.mozilla.net
    - "*.cdn.mozilla.net"
    - mozilla-ohttp.fastly-edge.com
    - mozilla.cloudflare-dns.com

    # Chrome/Chromium 后台服务。
    - clients*.google.com
    - safebrowsing.googleapis.com
    - update.googleapis.com
    - variations.google.com
    - optimizationguide-pa.googleapis.com
    - redirector.gvt1.com
    - edgedl.me.gvt1.com
    - dl.google.com
    - mtalk.google.com

    # Edge / Windows 浏览器后台服务。
    - edge.microsoft.com
    - "*.edge.microsoft.com"
    - msedge.api.cdp.microsoft.com
    - iecvlist.microsoft.com
