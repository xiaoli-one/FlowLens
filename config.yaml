    - v10.events.data.microsoft.com

    # Safari / Apple 后台服务。
    - configuration.apple.com
    - configuration.ls.apple.com
    - gsp-ssl.ls.apple.com
    - mesu.apple.com
    - swscan.apple.com
    - swcdn.apple.com
    - xp.apple.com
